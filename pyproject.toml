[project]
name = "routine-graph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.7",
    "langchain-openrouter>=0.2.9",
    "langgraph>=1.2.16",
    "numpy>=2.4.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "torch>=2.14.1",
]

[project.scripts]
routine-graph = "routine_graph:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
