[project]
name = "routine-graph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.15.1",
    "langchain>=1.4.7",
    "langchain-ollama>=1.1.0",
    "langchain-openrouter>=0.2.9",
    "langgraph>=1.2.16",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
]

[project.scripts]
routine-graph = "routine_graph:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
